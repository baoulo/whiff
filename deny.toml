# cargo-deny: licences, advisories, bans and sources. Run `cargo deny check`.

[graph]
all-features = true

[advisories]
# RustSec advisories: vulnerabilities and unmaintained crates fail the build.
ignore = []

[licenses]
# whiff is MIT; dependencies must be permissive and MIT-compatible.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# Licences above that no current dependency uses are pre-approved, not an error.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
