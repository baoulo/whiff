# Generated by sastri (github_releases), then adapted; see Sastri.toml.
# Push a `vX.Y.Z` tag matching Cargo.toml to build the binaries, create the
# GitHub Release (with SHA256SUMS), push the Homebrew formula and Scoop
# manifest to baoulo/homebrew-tap and baoulo/scoop-bucket, and publish to
# crates.io.
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check-version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        shell: bash
        run: |
          set -euo pipefail
          crate="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [[ "v${crate}" != "${GITHUB_REF_NAME}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate}"
            exit 1
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds are static (musl) so they run on any distribution:
          # a glibc build from ubuntu-latest needs glibc 2.39.
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            bin: whiff
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            bin: whiff
          - platform: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: whiff
          - platform: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            bin: whiff
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: whiff.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if rustup toolchain install stable --target "${{ matrix.target }}"; then
              rustup default stable
              exit 0
            fi
            echo "rustup download failed (attempt ${attempt}/5), retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Release binaries carry every format collection.
      - run: cargo build --release --locked --features full --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.platform != 'macos-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          "${bin}" --version
          "${bin}" --jsonl Cargo.toml > report.json
          grep -q '"format":"cargo_manifest"' report.json

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          ARCHIVE="whiff-${VERSION}-${{ matrix.platform }}.tar.gz"
          cd "target/${{ matrix.target }}/release"
          tar -czf "${{ github.workspace }}/${ARCHIVE}" "${{ matrix.bin }}"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          ARCHIVE="whiff-${VERSION}-${{ matrix.platform }}.zip"
          cd "target/${{ matrix.target }}/release"
          7z a "${{ github.workspace }}/${ARCHIVE}" "${{ matrix.bin }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: whiff-${{ github.ref_name }}-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          shopt -s nullglob
          sha256sum whiff-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

  # Set the release's version and checksums in the Homebrew formula and the
  # Scoop manifest, and push them to the tap and the bucket. Needs the
  # PACKAGING_TOKEN secret: a fine-grained token with Contents read/write on
  # baoulo/homebrew-tap and baoulo/scoop-bucket (GITHUB_TOKEN cannot push to
  # other repositories).
  update-packaging:
    name: Update Homebrew tap and Scoop bucket
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        env:
          PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        run: |
          if [[ -z "${PACKAGING_TOKEN}" ]]; then
            echo "PACKAGING_TOKEN secret is not set"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Fill version and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" --pattern SHA256SUMS --dir "${RUNNER_TEMP}"
          SUMS_FILE="${RUNNER_TEMP}/SHA256SUMS" scripts/update-packaging.sh "${GITHUB_REF_NAME}"

      - uses: actions/checkout@v4
        with:
          repository: baoulo/homebrew-tap
          token: ${{ secrets.PACKAGING_TOKEN }}
          path: homebrew-tap

      - uses: actions/checkout@v4
        with:
          repository: baoulo/scoop-bucket
          token: ${{ secrets.PACKAGING_TOKEN }}
          path: scoop-bucket

      # A re-run with nothing new commits nothing.
      - name: Push
        run: |
          set -euo pipefail
          publish() {
            local repo="$1" src="$2" dest="$3"
            cp "${src}" "${repo}/${dest}"
            cd "${repo}"
            if [[ -z "$(git status --porcelain -- "${dest}")" ]]; then
              echo "${repo}: ${dest} already up to date"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "${dest}"
              git commit -m "whiff ${GITHUB_REF_NAME#v}"
              git push
            fi
            cd - >/dev/null
          }
          publish homebrew-tap packaging/homebrew/whiff.rb Formula/whiff.rb
          publish scoop-bucket packaging/scoop/whiff.json whiff.json

  # Last, because a crates.io publish cannot be undone; only once every
  # install channel has the release.
  publish-crates-io:
    name: Publish to crates.io
    needs: [build, github-release, update-packaging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "CRATES_IO_TOKEN secret is not set"
            exit 1
          fi
          cargo publish --locked
