# Install-channel wrappers for the whiff executable (https://crates.io/crates/sastri).
# Secrets are never stored here. CI already exists (.github/workflows/ci.yml).
# The release workflow was generated once by sastri and is now maintained by
# hand (static musl Linux builds, `--features full`, publish gated on the tag
# matching Cargo.toml), so `github_releases` stays off: do not regenerate it.

[project]
name = "whiff"
description = "Sniff any file and get one JSON document describing it: identity, provenance, rights, physical properties and an LLM-ready view of its content."
github_owner = "baoulo"
github_repo = "whiff"
binary_name = "whiff"
version = "0.2.0"
cargo_manifest = "Cargo.toml"
license = "MIT"
homepage = "https://github.com/baoulo/whiff"

[org]
homebrew_tap = "baoulo/homebrew-tap"
scoop_bucket = "baoulo/scoop-bucket"
asdf_plugin_repo = "baoulo/asdf-whiff"

[mechanisms]
ci = false
github_releases = false
install_sh = true
homebrew = true
scoop = true
asdf = true
mise = true
setup_action = true
npm = false
pypi = false
hex = false
ruby_gem = false
haskell_cabal = false

[release]
platforms = [
  "linux-x86_64",
  "linux-aarch64",
  "macos-aarch64",
  "macos-x86_64",
  "windows-x86_64",
]
publish_crates_io = true
publish_sha256sums = true

[paths]
packaging_dir = "packaging"
scripts_dir = "scripts"
workflows_dir = ".github/workflows"
actions_dir = ".github/actions"
