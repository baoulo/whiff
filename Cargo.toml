[package]
name = "whiff"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Sniff any file and get one JSON document describing it: identity, provenance, rights, physical properties and an LLM-ready view of its content."
readme = "README.md"
keywords = ["metadata", "file-format", "exif", "detection", "llm"]
categories = ["parser-implementations", "filesystem", "command-line-utilities"]
exclude = ["/baoulo", "/fuzz", "/tests/fixtures", "/.github"]
autobins = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "whiff"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "whiff-dev"
path = "src/bin/whiff-dev/main.rs"
required-features = ["dev"]

[features]
default = ["common", "cli"]
# Format collections (see docs/metadata-extracted.md, "Feature" column).
common = []
geo = []
science = []
data = []
cad = []
forensics = []
games = []
full = ["common", "geo", "science", "data", "cad", "forensics", "games"]
# The `whiff` command-line tool.
cli = ["dep:clap", "dep:rayon", "dep:ignore"]
# The `whiff-dev` contributor tool.
dev = ["dep:clap", "full"]

[dependencies]
blake3 = { version = "1.8", default-features = false, features = ["std", "pure"] }
jiff = "0.2"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2"

clap = { version = "4.6", features = ["derive"], optional = true }
ignore = { version = "0.4", optional = true }
rayon = { version = "1.12", optional = true }

[dev-dependencies]
insta = { version = "1.49", features = ["json"] }
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package.insta]
opt-level = 3
