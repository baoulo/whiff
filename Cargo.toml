[package]
name = "whiff"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/baoulo/whiff"
homepage = "https://github.com/baoulo/whiff"
documentation = "https://docs.rs/whiff"
description = "Sniff any file and get one JSON document describing it: identity, provenance, rights, physical properties and an LLM-ready view of its content."
readme = "README.md"
keywords = ["metadata", "file-format", "exif", "detection", "llm"]
categories = ["parser-implementations", "filesystem", "command-line-utilities", "multimedia", "email"]
exclude = ["/baoulo", "/fuzz", "/tests", "/.github", "/packaging", "/scripts", "/Sastri.toml"]
autobins = false
build = "build.rs"

[package.metadata.docs.rs]
features = ["full"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "whiff"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "whiff-dev"
path = "src/bin/whiff-dev/main.rs"
required-features = ["dev"]

[features]
default = ["common", "cli"]
# Format collections (see docs/metadata-extracted.md, "Feature" column).
common = [
    "dep:csv",
    "dep:ego-tree",
    "dep:json5",
    "dep:mail-parser",
    "dep:pulldown-cmark",
    "dep:scraper",
    "dep:serde-saphyr",
    "dep:sqlparser",
    "dep:toml",
]
geo = []
science = []
data = []
cad = []
forensics = []
games = []
full = ["common", "geo", "science", "data", "cad", "forensics", "games"]
# The `whiff` command-line tool.
cli = ["dep:clap", "dep:rayon", "dep:ignore"]
# The `whiff-dev` contributor tool.
dev = ["dep:clap", "full"]

[dependencies]
blake3 = { version = "1.8", default-features = false, features = ["std", "pure"] }
jiff = "0.2"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2"
# Detection and the text toolkit (`whiff::text`), used by every format.
aho-corasick = "1.1"
chardetng = "1"
encoding_rs = "0.8"
file-format = { version = "0.29", features = ["reader"] }
plist = { version = "1.10", default-features = false }
regex = "1.13"
rust-stemmers = "1.2"
stop-words = "0.10"
unicode-segmentation = "1.13"
unicode-width = "0.2"
whatlang = "0.18"
# Embedded metadata (`whiff::meta`: EXIF, XMP, IPTC, ICC) and decompression
# (bzip2, LZ4, Snappy and Unix compress are in-house).
brotli-decompressor = { version = "6.1", default-features = false, features = ["std"] }
kamadak-exif = "0.6"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std"] }
md-5 = "0.11"
miniz_oxide = "0.8"
quick-xml = "0.42"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }

# Format parsers (feature `common`).
csv = { version = "1.4", optional = true }
ego-tree = { version = "0.11", optional = true }
json5 = { version = "1.3", optional = true }
mail-parser = { version = "0.11", default-features = false, features = ["full_encoding"], optional = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
scraper = { version = "0.27", default-features = false, optional = true }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"], optional = true }
sqlparser = { version = "0.63", default-features = false, features = ["std"], optional = true }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"], optional = true }

clap = { version = "4.6", features = ["derive"], optional = true }
ignore = { version = "0.4", optional = true }
rayon = { version = "1.12", optional = true }

[target.'cfg(unix)'.dependencies]
uzers = { version = "0.12", default-features = false }
xattr = "1.6"

[dev-dependencies]
insta = { version = "1.49", features = ["json"] }
miniz_oxide = "0.8"
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package.insta]
opt-level = 3

# Dependencies (regex, html5ever, parsers) optimised in dev and test builds:
# the conformance suite feeds them megabytes of hostile input. whiff itself
# stays unoptimised for debugging and coverage.
[profile.dev.package."*"]
opt-level = 2
