[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbour-tides"
version = "0.4.1"
description = "Tide predictions for small harbours."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Ada Example", email = "ada@example.org" }]
keywords = ["tides", "oceanography"]
dependencies = ["numpy>=2.0", "pandas>=2.2", "httpx"]

[project.optional-dependencies]
plot = ["matplotlib"]
dev = ["pytest", "ruff"]

[project.scripts]
tides = "harbour_tides.cli:main"

[project.urls]
Repository = "https://git.example.org/harbour-tides"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
