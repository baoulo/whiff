[metadata]
name = saltmere-gauge
version = 2.1.0
description = Gauge daemon for Saltmere Harbour
author = Harbour Office
license = CC0-1.0
url = https://git.harbour.test/gauge
keywords = tides, harbour
classifiers =
    Programming Language :: Python :: 3
    License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication

[options]
packages = find:
python_requires = >=3.10
install_requires =
    pyserial>=3.5
    click

[options.extras_require]
plot = matplotlib

[options.entry_points]
console_scripts =
    gauged = gauge.daemon:main
