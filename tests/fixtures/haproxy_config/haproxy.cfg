global
    log /dev/log local0
    maxconn 2000

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend harbour_web
    bind *:80
    bind *:443 ssl crt /etc/haproxy/saltmere.pem
    default_backend tides

backend tides
    balance roundrobin
    server tide1 10.0.0.11:8080 check
    server tide2 10.0.0.12:8080 check

listen stats
    bind *:8404
    mode http
    stats enable
